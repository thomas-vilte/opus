# Temporal, sólo para el fork: evidencia de que el kernel NEON pasa en ARM64
# nativo con Go 1.27. No mandar upstream, allá va como cambio en .goassets.
name: ARM64 NEON check
on:
  push:
    branches:
      - test/silk-neon-parity
  workflow_dispatch:

jobs:
  neon:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: go version && go env GOARCH

      - name: NEON parity (el objetivo de esta rama)
        run: |
          go vet ./internal/resample/silk
          go test -count=1 -v -run IIRFIR ./internal/resample/silk
          go test -count=1 -tags=purego ./internal/resample/silk

      - name: CELT sin -race
        continue-on-error: true
        run: go test -count=1 -run TestExpRotation1 ./internal/celt

      - name: CELT con -race (lo que corre test-macos)
        continue-on-error: true
        run: go test -race -count=1 -run TestExpRotation1 ./internal/celt

      - name: CELT sin optimizaciones FMA
        continue-on-error: true
        run: go test -count=1 -gcflags=all=-d=fmahash=0 -run TestExpRotation1 ./internal/celt

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: go version && go env GOOS GOARCH

      - name: NEON parity en darwin/arm64
        run: |
          go vet ./internal/resample/silk
          go test -count=1 -v -run IIRFIR ./internal/resample/silk
          go test -count=1 -tags=purego ./internal/resample/silk

      - name: NEON parity con -race (lo que corre test-macos de verdad)
        run: go test -race -count=1 -run IIRFIR ./internal/resample/silk

      - name: Suite completa, -race + Go 1.27 (matriz propuesta 1.24/1.27)
        continue-on-error: true
        run: go test -race -count=1 ./...

      - name: CELT sin -race
        continue-on-error: true
        run: go test -count=1 -run TestExpRotation1 ./internal/celt

      - name: CELT con -race (lo que corre test-macos)
        continue-on-error: true
        run: go test -race -count=1 -run TestExpRotation1 ./internal/celt
